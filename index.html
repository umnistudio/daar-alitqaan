<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daar Al-Itqaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Naskh+Arabic:wght@400;500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--forest:#26352B;--olive:#596B45;--soft:#A3B765;--sage:#DDE5C8;--ivory:#F8F8F3}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Poppins',system-ui,sans-serif;font-size:14px;color:var(--forest);background:var(--ivory)}
.w{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.sb{background:#fff;border-right:1px solid var(--sage);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.br{display:flex;align-items:center;gap:10px;padding:0 4px 14px;margin-bottom:8px;border-bottom:1px solid var(--sage)}
.br svg{flex-shrink:0}
.br b{display:block;font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:18px;line-height:1.15}
.br small{display:block;font-weight:300;font-size:10.5px;letter-spacing:.3px;color:var(--olive);margin-top:3px}
.gl{font-size:12px;color:#8A937C;padding:10px 12px 4px}
.mn{padding:24px;min-width:0}
.h{font-size:20px;font-weight:500;margin:0 0 16px}
.k{background:#fff;border:1px solid var(--sage);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.g{display:grid;gap:10px;margin-bottom:12px}
.s{color:var(--olive);font-size:12px}
.m{font-size:24px;font-weight:500}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--sage);border-radius:10px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;font-weight:400}
th{background:var(--sage)}
td{border-top:1px solid var(--sage)}
tr.cl{cursor:pointer}
tr.cl:hover td{background:var(--ivory)}
.b{padding:2px 10px;border-radius:99px;font-size:12px;white-space:nowrap}
.bar{height:8px;background:var(--sage);border-radius:99px}
.bar i{display:block;height:8px;border-radius:99px;background:var(--olive)}
.dt{width:20px;height:20px;border-radius:50%;display:inline-block;margin:0 4px 4px 0}
button{font:inherit;font-size:13px;padding:5px 14px;border-radius:99px;border:1px solid var(--olive);background:#fff;color:var(--forest);cursor:pointer}
input,select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--sage);background:#fff;color:var(--forest)}
.it{padding:9px 12px;border-radius:8px;margin-bottom:2px;cursor:pointer;display:flex;gap:10px;align-items:center;border:0;background:none;width:100%;text-align:left;color:inherit;font-size:14px}
.it:hover{background:var(--ivory)}
.it.on{background:var(--sage);font-weight:500}
.it svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tb{border:0;background:var(--sage);margin-right:6px}
.tb.on{background:var(--olive);color:#fff}
.cl{cursor:pointer}
.it:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}
.k1{stroke:var(--s1)}.k2{stroke:var(--s2)}
@media(max-width:760px){.w{grid-template-columns:1fr}.sb{position:static;height:auto}.mn{padding:16px}.g{grid-template-columns:repeat(2,minmax(0,1fr))!important}table{font-size:12px}th,td{padding:7px}}
@media print{.sb,button,select,.noprint{display:none!important}.w{display:block}.mn{padding:0}}
</style>
</head>

<div id="app"></div>

{n:"Aisyah Nur Hidayah",h:0,j:"Juz 30",p:62,tp:55,st:"Gratis",sa:"An-Naba’ 1–20",sa2:"Abasa 30–42",sq:"An-Nazi’at",mz:"Juz 29",iz:2,al:1},
{n:"Fatimah Azzahra",h:0,j:"Juz 29",p:40,tp:50,st:"Lunas",sa:"Al-Mulk 1–15",sa2:"Al-Mulk 16–30",sq:"Al-Qalam",mz:"Juz 30",iz:1,al:0},
{n:"Khadijah Salsabila",h:1,j:"Juz 30",p:85,tp:80,st:"Belum Bayar",sa:"Al-Ghasyiyah",sa2:"Al-A’la 10–19",sq:"At-Thariq",mz:"Juz 29",iz:0,al:2},
{n:"Maryam Husna",h:1,j:"Juz 1",p:15,tp:20,st:"Lunas",sa:"Al-Baqarah 20–30",sa2:"Al-Baqarah 10–19",sq:"Al-Fatihah",mz:"—",iz:3,al:0},
{n:"Zainab Rahmah",h:2,j:"Juz 29",p:28,tp:25,st:"Gratis",sa:"Nuh 1–14",sa2:"Al-Ma’arij 30–44",sq:"Al-Haqqah",mz:"Juz 30",iz:0,al:0}
];
var U=[["12 Nov","Khadijah Salsabila","Juz 30 (Tasmi’)","Mumtaz","Mutqin"],["10 Nov","Aisyah Nur Hidayah","An-Naba’ 1–40","Jayyid Jiddan","Mutqin"],["9 Nov","Fatimah Azzahra","Al-Mulk 1–30","Jayyid","Perlu Diulang"],["7 Nov","Zainab Rahmah","Nuh 1–28","Jayyid Jiddan","Mutqin"]];
var AN=[{t:"15 Nov",x:"Tasmi’ juz 30 hari Kamis, pukul 08.00."},{t:"12 Nov",x:"Halaqah An-Nur libur hari Jumat."}];

var C={"Lunas":["#DDE5C8","#26352B"],"Belum Bayar":["#F3E3C3","#6B4A12"],"Gratis":["#26352B","#DDE5C8"],"Mutqin":["#DDE5C8","#26352B"],"Perlu Diulang":["#F3E3C3","#6B4A12"],"Sesuai":["#DDE5C8","#26352B"],"Tertinggal":["#F3E3C3","#6B4A12"]};
var IC={
dash:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
dat:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.5 4 2.5 4 6"/>',
hq:'<circle cx="12" cy="8" r="3"/><circle cx="5" cy="10" r="2.2"/><circle cx="19" cy="10" r="2.2"/><path d="M6 20c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5"/>',
pj:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>',
mut:'<path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v13"/>',
tg:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',

rp:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/>',
pay:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
rw:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
lp:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
an:'<path d="M3 11v3l12 5V6L3 11z"/><path d="M15 8c3 0 5 1.5 5 4s-2 4-5 4"/>',
set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
var NV=[["Utama",[["dash","Dashboard"]]],["Akademik",[["dat","Data Thalibah"],["hq","Halaqah"],["pj","Pengajar"],["mut","Mutaba’ah"],["tg","Target Hafalan"],["uj","Ujian Dan Tasmi’"],["att","Rekap Kehadiran"],["rp","Rapor Hafalan"]]],["Keuangan",[["pay","Pembayaran"],["rw","Riwayat Dan Kwitansi"],["lp","Laporan"]]],["Lainnya",[["an","Pengumuman"],["set","Pengaturan"]]]];
var cur="dash",sel=0,tab="set",kw=-1;
function bd(s){var c=C[s]||C.Lunas;return '<span class="b" style="background:'+c[0]+';color:'+c[1]+'">'+s+'</span>'}
function cnt(s){return D.filter(function(d){return d.st==s}).length}
function met(a,b){return '<div class="k" style="margin:0"><div class="s">'+a+'</div><div class="m">'+b+'</div></div>'}
function rpf(n){return "Rp"+n.toLocaleString("id-ID")}
function hd(d){return 20-d.iz-d.al}
function nm(d){return d.n.split(" ").slice(0,2).join(" ")}
function tbl(h,rows){return '<table><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join("")+'</tr>'+rows.join("")+'</table>'}
function tr(cells,i){return '<tr'+(i!=null?' class="cl" onclick="pick('+i+')"':'')+'>'+cells.map(function(c){return '<td>'+c+'</td>'}).join("")+'</tr>'}
function bar(p){return '<div class="bar" style="min-width:70px"><i style="width:'+p+'%"></i></div>'}
function avg(a){return a.length?Math.round(a.reduce(function(x,y){return x+y},0)/a.length):0}
function opts(){return D.map(function(x,i){return '<option value="'+i+'"'+(i==sel?' selected':'')+'>'+x.n+'</option>'}).join("")}
var P={

dat:function(){return '<h1 class="h">Data Thalibah</h1>'+tbl(["Nama","Halaqah","Hafalan","Pembayaran"],D.map(function(d,i){return tr([d.n,H[d.h].n,d.j+" · "+d.p+"%",bd(d.st)],i)}))+'<div class="s" style="margin-top:10px">Klik nama untuk membuka mutaba’ah.</div>'},

pj:function(){return '<h1 class="h">Pengajar</h1>'+tbl(["Nama","Halaqah","Jadwal","Thalibah"],H.map(function(h,i){return tr([h.u,h.n,h.j,D.filter(function(d){return d.h==i}).length])}))},

if(tab=="set")return h+tbl(["Tanggal","Sabaq","Sabqi","Manzil","Status"],[tr(["12 Nov",d.sa,d.sq,d.mz,bd("Mutqin")]),tr(["10 Nov",d.sa2,d.sq,d.mz,bd(d.p>=40?"Mutqin":"Perlu Diulang")]),tr(["8 Nov",'<span class="s">Tidak Hadir</span>',"—","—","—"])]);
var a=[];for(var k=0;k<20;k++)a.push("#A3B765");[3,11,15].slice(0,d.iz).forEach(function(x){a[x]="#B8B7A8"});[7,17].slice(0,d.al).forEach(function(x){a[x]="#B5594B"});
return h+'<div class="k"><div style="margin-bottom:8px">'+a.map(function(c){return '<span class="dt" style="background:'+c+'"></span>'}).join("")+'</div><div class="s">Hadir '+hd(d)+' · Izin '+d.iz+' · Alpa '+d.al+' dari 20 pertemuan</div></div>'},
tg:function(){return '<h1 class="h">Target Hafalan</h1>'+tbl(["Nama","Progres","Target","Status"],D.map(function(d,i){return tr([nm(d),bar(d.p)+'<span class="s">'+d.p+'%</span>',d.tp+"%",bd(d.p>=d.tp?"Sesuai":"Tertinggal")],i)}))+'<div class="s" style="margin-top:10px">Target dibandingkan dengan progres nyata sampai bulan ini.</div>'},
uj:function(){return '<h1 class="h">Ujian Dan Tasmi’</h1>'+tbl(["Tanggal","Thalibah","Materi","Nilai","Status"],U.map(function(u){return tr([u[0],u[1].split(" ").slice(0,2).join(" "),u[2],u[3],bd(u[4])])}))},
